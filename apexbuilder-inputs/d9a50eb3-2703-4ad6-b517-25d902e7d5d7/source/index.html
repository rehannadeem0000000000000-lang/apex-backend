<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1a2b" />
  <title>IX OS 16</title>
  <style>
    :root {
      --bg: #000;
      --navy: #0a1a2b;
      --navy-2: #0d2238;
      --surface: #10233a;
      --elevated: #16304c;
      --fg: #e5e7eb;
      --muted: #8b9bb0;
      --subtle: #5c6d82;
      --accent: #00b4ff;
      --accent-fg: #001018;
      --frost: #e5e7eb;
      --ok: #3ddc84;
      --danger: #ff6b6b;
      --border: #1e3a54;
      --chip-ice: #123a4d; --on-ice: #9ad4ec;
      --chip-sage: #143628; --on-sage: #86e0b8;
      --chip-mist: #252c3a; --on-mist: #d0d6e0;
      --chip-sand: #3a3420; --on-sand: #e6d6a8;
      --chip-rose: #3a1c24; --on-rose: #f0a3b0;
      --chip-azure: #1a2f6b; --on-azure: #8ab4f8;
      --ease: cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--navy); color: var(--fg); font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    button, [role="button"] { cursor: pointer; font: inherit; color: inherit; background: none; border: 0; }
    input, textarea { font: inherit; color: inherit; }
    .desk { min-height: 100dvh; display: grid; place-items: center; position: relative; overflow: hidden; }
    .desk::before { content: ""; position: absolute; inset: auto 0 -20% 0; height: 55%; background: radial-gradient(80% 70% at 50% 100%, color-mix(in oklab, var(--accent) 28%, transparent), transparent 70%); pointer-events: none; }
    .fit { width: min(390px, 100vw); height: min(844px, 100dvh); position: relative; z-index: 1; }
    .bezel { position: absolute; inset: 0; background: linear-gradient(180deg, #15283c, #070d14 40%, #05080c); border-radius: 3rem; padding: 10px; box-shadow: 0 24px 80px rgb(0 0 0 / .55), 0 0 0 1px rgb(0 180 255 / .12); }
    .screen { position: relative; width: 100%; height: 100%; border-radius: 2.35rem; overflow: hidden; background: var(--navy); isolation: isolate; }
    .hole { position: absolute; top: 10px; left: 50%; z-index: 80; width: 92px; height: 22px; transform: translateX(-50%); border-radius: 999px; background: #05070a; pointer-events: none; }
    .glyph { position: absolute; left: 7px; top: 128px; width: 4px; height: 168px; border-radius: 99px; background: #121820; pointer-events: none; z-index: 3; }
    .glyph.on { background: var(--accent); box-shadow: 0 0 14px var(--accent); }
    .wordmark { letter-spacing: .28em; font-weight: 700; font-size: 12px; }
    .wordmark span { color: var(--accent); }
    .brand-row { position: absolute; left: 24px; top: 24px; display: none; align-items: center; gap: 12px; }
    .foot { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .32em; color: var(--muted); display: none; pointer-events: none; }
    @media (min-width: 900px) { .brand-row, .foot { display: flex; } .foot { display: block; } }
    @media (max-width: 520px) {
      .desk { background: #000; }
      .desk::before { display: none; }
      .fit { width: 100vw; height: 100dvh; }
      .bezel { padding: 0; border-radius: 0; box-shadow: none; background: #000; }
      .screen { border-radius: 0; }
      .glyph { display: none; }
    }
    .layer { position: absolute; inset: 0; }
    .status { height: 38px; padding: 14px 16px 0; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--frost); position: relative; z-index: 6; }
    .status .sig { display: flex; gap: 6px; align-items: center; }
    .wall { position: absolute; inset: 0; background:
      radial-gradient(120% 80% at 20% 0%, #1a4d6e 0%, transparent 50%),
      radial-gradient(90% 70% at 90% 20%, #00b4ff33 0%, transparent 45%),
      linear-gradient(180deg, #071422 0%, #0a1a2b 45%, #031018 100%); }
    .wall::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image:
      radial-gradient(circle at 12% 18%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 72% 12%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 40% 28%, #9ad4ec 0 1px, transparent 1.6px),
      radial-gradient(circle at 88% 36%, #fff 0 .8px, transparent 1.2px),
      radial-gradient(circle at 22% 62%, #fff 0 1px, transparent 1.4px),
      radial-gradient(circle at 64% 70%, #00b4ff 0 1px, transparent 1.6px);
      opacity: .55; }
    .wall.city { background:
      radial-gradient(70% 50% at 50% 100%, #00b4ff22, transparent 60%),
      linear-gradient(180deg, #102033, #0a1522 50%, #061018); }
    .wall.orbit { background:
      radial-gradient(circle at 70% 20%, #3a6ad655, transparent 40%),
      radial-gradient(circle at 20% 80%, #00b4ff33, transparent 42%),
      #071018; }
    .press:active { transform: scale(.96); }
    .press { transition: transform 140ms var(--ease); }
    .home, .lock, .app, .shade, .recents { display: flex; flex-direction: column; }
    .lock-body { flex: 1; padding: 36px 24px 0; position: relative; z-index: 2; }
    .dot-clock { display: flex; align-items: center; gap: 8px; }
    .digit { display: grid; grid-template-columns: repeat(5, 6px); gap: 3px; }
    .dot { width: 6px; height: 6px; border-radius: 99px; background: rgb(229 231 235 / .12); }
    .dot.on { background: var(--frost); box-shadow: 0 0 8px rgb(0 180 255 / .55); }
    .colon { display: grid; gap: 10px; padding: 0 2px; }
    .glance { margin-top: 18px; max-width: 17rem; border-radius: 24px; background: rgb(10 26 43 / .55); padding: 12px 16px; }
    .kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; color: var(--muted); }
    .notice { margin-top: 8px; border-radius: 16px; background: rgb(10 26 43 / .55); padding: 12px 16px; text-align: left; width: 100%; }
    .lock-foot { padding: 0 20px 22px; position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .now { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; border-radius: 999px; background: color-mix(in oklab, var(--navy) 72%, black); box-shadow: inset 0 0 0 1px rgb(0 180 255 / .14); width: 100%; text-align: left; }
    .handle { width: 120px; height: 4px; border-radius: 99px; background: rgb(229 231 235 / .42); }
    .nav { height: 22px; display: grid; place-items: center; position: relative; z-index: 20; }
    .home-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 12px 4px; position: relative; z-index: 2; }
    .weather { border-radius: 24px; background: rgb(10 26 43 / .5); padding: 12px 16px; text-align: left; }
    .grid { margin-top: 10px; flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 0; padding-bottom: 6px; scrollbar-width: none; }
    .grid::-webkit-scrollbar { display: none; }
    .icon { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--frost); }
    .chip { width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgb(0 180 255 / .14); }
    .chip svg { width: 22px; height: 22px; }
    .chip.sm { width: 48px; height: 48px; }
    .chip.ice { background: var(--chip-ice); color: var(--on-ice); }
    .chip.sage { background: var(--chip-sage); color: var(--on-sage); }
    .chip.mist { background: var(--chip-mist); color: var(--on-mist); }
    .chip.sand { background: var(--chip-sand); color: var(--on-sand); }
    .chip.rose { background: var(--chip-rose); color: var(--on-rose); }
    .chip.azure { background: var(--chip-azure); color: var(--on-azure); }
    .ilab { max-width: 68px; font-size: 10px; font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dock { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 26px; background: color-mix(in oklab, var(--navy) 78%, transparent); box-shadow: 0 8px 28px rgb(0 0 0 / .35), inset 0 0 0 1px rgb(0 180 255 / .12); }
    .app { background: var(--navy); z-index: 20; animation: up 160ms var(--ease); }
    @keyframes up { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    .bar { height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-weight: 600; }
    .bar h1 { font-size: 16px; }
    .title { font-size: 28px; font-weight: 600; letter-spacing: -.03em; padding: 4px 18px 10px; }
    .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    .scroll { flex: 1; overflow: auto; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }
    .search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; margin: 0 16px; border-radius: 999px; background: var(--elevated); }
    .search input, .field { width: 100%; background: transparent; border: 0; outline: none; }
    .field { height: 44px; padding: 0 14px; border-radius: 999px; background: var(--elevated); }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; }
    .key { height: 54px; border-radius: 999px; background: var(--elevated); font-size: 22px; font-weight: 500; }
    .key.op { background: var(--surface); color: var(--accent); }
    .key.eq { background: var(--accent); color: var(--accent-fg); }
    .key.wide { grid-column: span 2; }
    .bubble-me, .bubble-them { max-width: 78%; padding: 8px 12px; font-size: 14px; line-height: 1.4; margin: 6px 16px; }
    .bubble-me { margin-left: auto; background: var(--accent); color: var(--accent-fg); border-radius: 16px 16px 4px 16px; }
    .bubble-them { background: var(--elevated); border-radius: 16px 16px 16px 4px; }
    .shade { z-index: 40; background: color-mix(in oklab, var(--navy) 92%, black); transform: translateY(-103%); transition: transform 320ms var(--ease); pointer-events: none; }
    .shade.open { transform: none; pointer-events: auto; }
    .qs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; }
    .tile { height: 64px; border-radius: 18px; background: var(--elevated); display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left; }
    .tile.on { background: var(--accent); color: var(--accent-fg); }
    .recents { z-index: 35; background: rgb(0 0 0 / .45); }
    .cards { display: flex; gap: 14px; overflow-x: auto; padding: 32px 24px; flex: 1; align-items: center; }
    .card { flex: 0 0 176px; height: 300px; border-radius: 24px; background: var(--navy); text-align: left; box-shadow: inset 0 0 0 1px rgb(0 180 255 / .16); overflow: hidden; }
    .toast { position: absolute; left: 50%; bottom: 68px; z-index: 70; transform: translateX(-50%); background: var(--elevated); padding: 8px 14px; border-radius: 999px; font-size: 12px; pointer-events: none; }
    .flash { position: absolute; inset: 0; z-index: 55; background: #f4fbff; }
    .range { width: 100%; accent-color: var(--accent); }
    .cam { flex: 1; margin: 8px 16px; border-radius: 24px; background: linear-gradient(180deg, #02040a, #0A1A2B 62%, #00B4FF); position: relative; }
    .yt { aspect-ratio: 16/9; border-radius: 14px; margin: 0 16px; position: relative; overflow: hidden; }
    .t-azure { background: linear-gradient(160deg, #101830, #3a6ad6); }
    .t-sage { background: linear-gradient(160deg, #0c2418, #1f8a5a); }
    .t-ice { background: linear-gradient(160deg, #0a1a2b, #1478a8); }
    .t-sand { background: linear-gradient(160deg, #2a2414, #b08a3a); }
    .t-rose { background: linear-gradient(160deg, #2a1016, #b44555); }
    .map { height: 240px; margin: 12px 16px; border-radius: 22px; background:
      linear-gradient(90deg, rgb(0 180 255 / .08) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(rgb(0 180 255 / .08) 1px, transparent 1px) 0 0 / 28px 28px, #10233a; position: relative; }
    .pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; font-size: 11px; }
    .muted { color: var(--muted); } .accent { color: var(--accent); } .sm { font-size: 12px; } .xs { font-size: 11px; }
    .pad { padding: 8px 16px; }
    .hidden { display: none !important; }
    .eq { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
    .eq i { display: block; width: 2px; height: 8px; background: var(--accent); border-radius: 99px; animation: eq .9s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: .12s; } .eq i:nth-child(3) { animation-delay: .24s; }
    @keyframes eq { 50% { height: 14px; } }
    .power { position: absolute; inset: 0; z-index: 50; background: rgb(0 0 0 / .55); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 64px; }
    .power .box { width: 256px; border-radius: 24px; overflow: hidden; background: var(--navy); }
    .off { position: absolute; inset: 0; background: #000; z-index: 60; }
  </style>
</head>

function save() {
  try { localStorage.setItem("ix-os-v18", JSON.stringify({
    wifi: S.wifi, bt: S.bt, airplane: S.airplane, dnd: S.dnd, saver: S.saver,
    glyph: S.glyph, volume: S.volume, brightness: S.brightness, wallpaper: S.wallpaper, notes: S.notes
  })); } catch {}
}
function load() {
  try {

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), 1600);
}

  const d = new Date();
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function dateNow() {
  return new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}

  const pat = DOTS[n] || DOTS[0];

function paint() {
  if (S.stage === "lock") renderLock();
  if (S.stage === "home") renderHome();
  renderApp();
  renderShade();
  renderRecents();
  renderChrome();
}

function openApp(id) {
  if (!APP_MAP[id]) { toast("That app is not installed"); return; }
  S.openApp = id;
  S.stage = "home";
  S.shade = false;
  S.recentsOpen = false;
  S.power = false;
  S.chat = id === "messages" ? S.chat : S.chat;
  S.setPage = id === "settings" ? S.setPage : "root";
  S.recents = [id, ...S.recents.filter(x => x !== id)].slice(0, 8);
  paint();
}

function handleAct(act, v, form) {
  if (act === "unlock") { S.stage = "home"; S.openApp = null; S.shade = false; paint(); return; }
  if (act === "goHome") { S.openApp = null; S.chat = null; S.yt = -1; S.noteId = null; S.setPage = "root"; S.recentsOpen = false; S.shade = false; paint(); return; }
  if (act === "home" || act === "chatBack") { if (act === "chatBack") { S.chat = null; paint(); return; } S.openApp = null; paint(); return; }
  if (act === "openRecents") { S.recentsOpen = true; S.openApp = null; paint(); return; }
  if (act === "closeRecents") { S.recentsOpen = false; paint(); return; }
  if (act === "closeShade") { S.shade = false; paint(); return; }
  if (act === "clearNotes") { S.notices = []; paint(); return; }
  if (act === "lock") { S.stage = "lock"; S.openApp = null; S.power = false; S.flashlight = false; paint(); return; }
  if (act === "restart") { S.stage = "lock"; S.openApp = null; S.power = false; S.off = false; toast("Restarted"); paint(); return; }
  if (act === "powerOff") { S.off = true; S.power = false; S.openApp = null; paint(); return; }
  if (act === "tog") {
    if (v === "airplane") { S.airplane = !S.airplane; if (S.airplane) S.wifi = S.bt = false; else S.wifi = true; }
    else S[v] = !S[v];
    save(); paint(); return;
  }
  if (act === "setPage") { S.setPage = v; paint(); return; }
  if (act === "setRoot") { S.setPage = "root"; paint(); return; }
  if (act === "ytBack") { S.yt = -1; paint(); return; }
  if (act === "noteBack") { S.noteId = null; paint(); return; }
  if (act === "yt") { S.yt = Number(v); paint(); return; }
  if (act === "openChat") { S.chat = v; paint(); return; }
  if (act === "openNote") { S.noteId = v; paint(); return; }
  if (act === "addNote") { const n = { id: "n" + Date.now(), title: "New note", body: "Tap back when you are done." }; S.notes.unshift(n); S.noteId = n.id; save(); paint(); return; }
  if (act === "togglePlay") { S.playing = !S.playing; paint(); return; }
  if (act === "skip") { S.track = (S.track + Number(v) + TRACKS.length) % TRACKS.length; S.playing = true; paint(); return; }
  if (act === "setTrack") { S.track = Number(v); S.playing = true; paint(); return; }
  if (act === "dial") { S.dial = (S.dial + v).slice(0, 12); paint(); return; }
  if (act === "dialClear") { S.dial = S.dial.slice(0, -1); paint(); return; }
  if (act === "dialContact") { S.dial = v; openApp("phone"); toast("Calling " + v); return; }
  if (act === "call") { toast(S.dial ? "Calling " + S.dial : "Enter a number"); return; }
  if (act === "snap") { S.photos.unshift("Shot " + clockNow()); document.getElementById("flash").classList.remove("hidden"); setTimeout(() => { document.getElementById("flash").classList.toggle("hidden", !S.flashlight); }, 120); toast("Saved to Photos"); return; }
  if (act === "mode") { toast(v + " mode ready"); return; }
  if (act === "calc") {
    if (v === "C") S.calc = "0";
    else if (v === "=") {
      try { const r = Function("return (" + S.calc.replace(/[^0-9+\-*/().]/g, "") + ")")(); S.calc = String(r); }
      catch { S.calc = "Error"; }
    } else S.calc = S.calc === "0" || S.calc === "Error" ? v : S.calc + v;
    paint(); return;
  }
  if (act === "sendMsg" && form) {
    const text = String(new FormData(form).get("text") || "").trim();
    if (text && S.chat) {
      S.threads[S.chat] = S.threads[S.chat] || [];
      S.threads[S.chat].push({ me: true, text });
    }
    paint(); return;
  }
  if (act === "ask" && form) {
    const raw = String(new FormData(form).get("q") || "").trim();
    if (!raw) return;
    const q = raw.toLowerCase();
    S.gemini.push({ me: true, text: raw });
    let a = "Try open camera, or ask about weather, time, or IX OS.";
    if (q.includes("weather")) a = "Northhaven is 72° and clear. Low tonight is 61°.";
    else if (q.includes("time")) a = "It is " + clockNow() + ".";
    else if (q.includes("ix os") || q.includes("arix")) a = "IX OS 16 Horizon blends Android 16, One UI 9, Nothing Glyph, and Pixel At a Glance.";
    else if (q.includes("open")) {
      const hit = APPS.find(a => q.includes(a.name.toLowerCase()) || q.includes(a.id));
      if (hit) { a = "Opening " + hit.name + "."; S.gemini.push({ me: false, text: a }); paint(); setTimeout(() => openApp(hit.id), 280); return; }
    }
    S.gemini.push({ me: false, text: a });
    paint(); return;
  }
  if (act === "gsearch" && form) { S.gq = String(new FormData(form).get("q") || ""); paint(); return; }
  if (act === "wall") { S.wallpaper = v; save(); toast("Wallpaper set"); paint(); return; }
}

const screen = document.getElementById("screen");
let startY = 0, shadePull = false;
screen.addEventListener("pointerdown", e => {
  startY = e.clientY;
  const r = screen.getBoundingClientRect();
  shadePull = e.clientY - r.top < 36 && S.stage !== "off";
});
screen.addEventListener("pointerup", e => {
  if (shadePull && e.clientY - startY > 28) { S.shade = true; paint(); }
  shadePull = false;
});
screen.addEventListener("click", e => {
  if (e.target.id === "off") { S.off = false; S.stage = "lock"; paint(); return; }
  const open = e.target.closest("[data-open]");
  if (open) { e.preventDefault(); e.stopPropagation(); openApp(open.dataset.open); return; }
  const act = e.target.closest("[data-act]");
  if (act && act.tagName !== "FORM") { e.preventDefault(); e.stopPropagation(); handleAct(act.dataset.act, act.dataset.v); }
});
screen.addEventListener("input", e => {
  if (e.target.dataset.act === "bright") { S.brightness = Number(e.target.value); document.getElementById("screen").style.filter = `brightness(${0.72 + S.brightness * 0.45})`; save(); }
  if (e.target.dataset.act === "vol") { S.volume = Number(e.target.value); save(); }
});
screen.addEventListener("submit", e => {
  const form = e.target.closest("form[data-act]");
  if (!form) return;
  e.preventDefault();
  handleAct(form.dataset.act, form.dataset.v, form);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (S.shade) S.shade = false;
    else if (S.recentsOpen) S.recentsOpen = false;
    else if (S.openApp) S.openApp = null;
    else if (S.stage === "home") S.stage = "lock";
    paint();
  }
});

load();
S.stage = "lock";
S.openApp = null;
paint();
setInterval(() => { if (S.stage === "lock" || !S.openApp) paint(); }, 30000);
  </script>
</body>
