name: Build User APK
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      config_path:
        required: true
      source_path:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build Capacitor APK
        run: |
          set -e
          # Find index.html and copy its entire folder to www
          INDEX_PATH=$(find "${{ github.event.inputs.source_path }}" -name "index.html" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then echo "index.html not found"; exit 1; fi
          SRC_DIR=$(dirname "$INDEX_PATH")
          mkdir -p www
          cp -r "$SRC_DIR/." www/
          
          # Setup Capacitor with latest versions to avoid tar bugs
          npm init -y
          npm install @capacitor/core@latest @capacitor/android@latest
          npm install -D @capacitor/cli@latest
          
          npx cap init "MyApp" "com.myapp" --web-dir=www
          npx cap add android
          npx cap sync android
          
          # Build the APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
