name: Build User APK
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      config_path:
        required: true
      source_path:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Path
        run: |
          echo "Looking in: ${{ github.event.inputs.source_path }}"
          ls -R "${{ github.event.inputs.source_path }}"
