name: Build User APK
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      config_path:
        required: true
      source_path:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Capacitor APK
        run: |
          set -e
          INDEX_PATH=$(find "${{ github.event.inputs.source_path }}" -name "index.html" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then echo "index.html not found"; exit 1; fi
          SRC_DIR=$(dirname "$INDEX_PATH")
          mkdir -p www
          cp -r "$SRC_DIR/." www/
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "MyApp" "com.myapp" --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
